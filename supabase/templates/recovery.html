<!-- Supabase → Authentication → Emails → "Reset password". Subject: Reset your Awakening Academy password -->
<div
    style="
        background: #060a14;
        padding: 32px 16px;
        font-family:
            Inter,
            Segoe UI,
            Arial,
            sans-serif;
    "
>
    <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="max-width: 520px; margin: 0 auto; background: #121a2e; border: 1px solid #263149; border-radius: 16px"
    >
        <tr>
            <td style="padding: 32px 32px 8px; text-align: center">
                <div
                    style="
                        font-size: 13px;
                        letter-spacing: 3px;
                        text-transform: uppercase;
                        color: #38a3ff;
                        font-weight: 700;
                    "
                >
                    The Awakening Academy
                </div>
                <h1 style="margin: 16px 0 8px; font-size: 24px; line-height: 1.3; color: #f5f7fb">
                    Choose a new password
                </h1>
                <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #b3bed3">
                    Someone (hopefully you!) asked to reset your password. Press the button to choose a new one.
                </p>
            </td>
        </tr>
        <tr>
            <td style="padding: 24px 32px; text-align: center">
                <a
                    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
                    style="
                        display: inline-block;
                        background: #38a3ff;
                        color: #050b18;
                        text-decoration: none;
                        font-weight: 700;
                        font-size: 16px;
                        padding: 14px 28px;
                        border-radius: 12px;
                    "
                >
                    Reset my password
                </a>
            </td>
        </tr>
        <tr>
            <td style="padding: 0 32px 32px; font-size: 13px; line-height: 1.6; color: #8a97b2; text-align: center">
                <p style="margin: 0 0 8px">The link works once and expires in one hour.</p>
                <p style="margin: 0">Didn’t ask for this? Ignore this email — your password stays the same.</p>
            </td>
        </tr>
    </table>
</div>
